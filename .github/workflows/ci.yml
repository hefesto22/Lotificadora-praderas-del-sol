name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  # Disparo manual, con `gh workflow run CI --ref main` o desde Actions.
  #
  # Por que hace falta: el 6-ago-2026 GitHub dejo de asignar runners dos veces
  # seguidas. Un run quedo 18 minutos «en progreso» con la seccion JOBS vacia
  # —nunca le asignaron maquina— y un push posterior directamente no genero
  # run. Sin `workflow_dispatch`, la unica forma de relanzar sobre el HEAD
  # actual es inventar un commit vacio, que ensucia la historia por un
  # problema que no es del codigo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    name: PHP ${{ matrix.php }} · ${{ matrix.dependency-version }}
    strategy:
      fail-fast: true
      matrix:
        php: ['8.5']
        dependency-version: [prefer-stable]

    # Config de DB/Redis a nivel de JOB: así TODOS los steps la ven.
    # Antes vivía suelta en los steps de migrate y test, y `artisan`
    # en el step de preparación quedaba apuntando al .env (puerto
    # 5442 local) contra unos servicios que aquí escuchan en 5432.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: praderas_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      # Paridad de motor con local y producción: PostgreSQL 18 (§7.1).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: praderas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pcre, pdo, pdo_pgsql, redis, tokenizer, xml, zip
          ini-values: error_reporting=E_ALL, memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        # Nota: composer install NO acepta --prefer-stable (solo composer update lo hace).
        # La matrix dependency-version queda como label informativo de qué resolución
        # de versiones espera el composer.lock que se commiteó.
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit de seguridad
        # §6.4: composer audit corre en CI y su fallo rompe el build. Una
        # dependencia con CVE conocido en un sistema que custodia dinero
        # ajeno no es una advertencia, es un bloqueo.
        run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Directorios de storage y cache writable (sin esto Filament/Livewire fallan)
          mkdir -p storage/framework/{cache/data,sessions,views,testing}
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          chmod -R 0777 storage bootstrap/cache
          # Symlink al disco public — necesario si algún test toca BrandingSetting
          php artisan storage:link

      - name: Lint (Pint)
        # --test: no escribe, solo verifica
        run: vendor/bin/pint --test -v

      - name: Rector (dry-run)
        # §17.1: si Rector propone cambios, el build falla. Mantiene el
        # codigo alineado con PHP 8.5 y Laravel 13 sin que nadie tenga que
        # acordarse de correrlo.
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Pest test suite
        run: vendor/bin/pest --parallel --ci
