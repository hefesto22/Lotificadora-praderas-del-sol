# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — Residencial Praderas del Sol
#
# SOLO datos. El runtime PHP corre nativo en Herd (§7.3): montar el
# código en un contenedor en macOS penaliza el I/O y no compra nada.
#
# Puertos DEDICADOS 5442 / 6389 para no chocar con los otros
# proyectos Olympo que ya ocupan 5432 / 6379 en esta Mac (§7.2).
#
# Levantar:  docker compose up -d
# Estado:    docker compose ps
# ─────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-praderas}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-praderas_dev}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: ${COMPOSE_POSTGRES_AUTH:-trust}
      # Consumida por el script de initdb para crear la base de tests.
      POSTGRES_TEST_DB: ${DB_DATABASE_TEST:-praderas_test}
    # ─────────────────────────────────────────────────────────────
    # 🔴 max_locks_per_transaction: 64 NO ALCANZA. Mordió el 12-ago-2026.
    #
    # Pest corre en 14 procesos paralelos y cada uno recrea SU base con un
    # `DROP TABLE ... CASCADE` sobre las ~35 tablas del esquema. Cada tabla
    # se lleva un lock, y con ella sus índices, sus FK y todo lo que
    # dependa: son cientos de locks por transacción, catorce veces a la vez.
    #
    # Con el valor por defecto reventó en cuanto el esquema creció una tabla
    # más —`vendedores`—, y el error no dice nada de eso: dice «out of
    # shared memory» y se cae en siete tests cualquiera, los que hayan
    # tocado último. Parece un bug del código y no lo es.
    #
    # 512 deja margen para que el esquema siga creciendo sin volver a
    # tropezar. Es memoria compartida reservada al arrancar y con este
    # número son unos pocos MB.
    #
    # ⚠️ Es un parámetro de ARRANQUE: cambiarlo pide recrear el contenedor
    # (`docker compose up -d --force-recreate postgres`). Los datos viven en
    # un volumen nombrado y no se pierden.
    # ─────────────────────────────────────────────────────────────
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
    ports:
      - "${COMPOSE_POSTGRES_PORT:-5442}:5432"
    volumes:
      # ⚠️ PostgreSQL 18 cambió PGDATA de /var/lib/postgresql/data a
      # /var/lib/postgresql/18/docker, y declara VOLUME sobre el padre
      # /var/lib/postgresql. Montar en .../data como en PG 16 hace que
      # Docker cree un volumen anónimo y el volumen nombrado quede
      # VACÍO: los datos se pierden al recrear el contenedor, sin error
      # visible. El montaje correcto en PG 18 es el directorio padre.
      - postgres_data:/var/lib/postgresql
      # Scripts que corren UNA sola vez, cuando PGDATA está vacío.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-praderas_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-praderas}_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${COMPOSE_REDIS_PORT:-6389}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-praderas}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-praderas}_redis_data
